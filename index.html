<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>汐科 ⇄ 板橋 通勤列車</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Share+Tech+Mono&display=swap');
  :root {
    --bg:#0a0e1a; --panel:#111827; --border:#1e2d45;
    --accent:#00c9a7; --accent2:#3b82f6; --warn:#f59e0b;
    --text:#e2e8f0; --text-dim:#64748b;
    --mono:'Share Tech Mono',monospace; --sans:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,201,167,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,201,167,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
  .container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 16px 48px;}
  header{text-align:center;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .logo-line{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
  h1{font-size:20px;font-weight:700;letter-spacing:4px;}
  .subtitle{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-top:4px;}
  .clock{font-family:var(--mono);font-size:28px;color:var(--accent);text-align:center;letter-spacing:3px;margin-bottom:20px;text-shadow:0 0 20px rgba(0,201,167,0.4);}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
  .tab-btn{padding:14px 8px;border:1px solid var(--border);background:var(--panel);border-radius:10px;cursor:pointer;transition:all 0.2s;text-align:center;}
  .tab-btn.active{border-color:var(--accent);background:rgba(0,201,167,0.08);box-shadow:0 0 16px rgba(0,201,167,0.15);}
  .tab-btn:hover:not(.active){background:rgba(255,255,255,0.04);}
  .tab-route{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--text);margin-bottom:3px;}
  .tab-btn.active .tab-route{color:var(--accent);}
  .tab-label{font-size:10px;color:var(--text-dim);letter-spacing:1px;}
  .query-btn{width:100%;padding:16px;background:linear-gradient(135deg,rgba(0,201,167,0.15),rgba(59,130,246,0.1));border:1px solid var(--accent);border-radius:12px;color:var(--accent);font-family:var(--mono);font-size:14px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;margin-bottom:20px;}
  .query-btn:hover{background:linear-gradient(135deg,rgba(0,201,167,0.25),rgba(59,130,246,0.2));box-shadow:0 0 24px rgba(0,201,167,0.3);transform:translateY(-1px);}
  .query-btn:active{transform:translateY(0);}
  .query-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .loading{display:none;text-align:center;padding:32px;color:var(--text-dim);font-family:var(--mono);font-size:12px;letter-spacing:2px;}
  .loading.visible{display:block;}
  .loading-bar{width:100%;height:2px;background:var(--border);border-radius:1px;margin-bottom:16px;overflow:hidden;}
  .loading-bar::after{content:'';display:block;height:100%;width:40%;background:var(--accent);border-radius:1px;animation:slide 1s infinite;}
  @keyframes slide{0%{transform:translateX(-150%);}100%{transform:translateX(400%);}}
  .error-box{display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:14px 16px;font-size:13px;color:#fca5a5;margin-bottom:16px;line-height:1.6;white-space:pre-wrap;}
  .error-box.visible{display:block;}
  .results{display:none;}
  .results.visible{display:block;}
  .results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px;}
  .results-title{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:2px;}
  .results-count{font-family:var(--mono);font-size:11px;color:var(--accent);}
  .train-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;animation:fadeUp 0.3s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .train-card:nth-child(2){animation-delay:.05s;} .train-card:nth-child(3){animation-delay:.1s;}
  .train-card:nth-child(4){animation-delay:.15s;} .train-card:nth-child(5){animation-delay:.2s;}
  .train-card:nth-child(6){animation-delay:.25s;} .train-card:nth-child(7){animation-delay:.3s;}
  .train-card:nth-child(8){animation-delay:.35s;} .train-card:nth-child(9){animation-delay:.4s;}
  .train-card.delayed{border-color:rgba(245,158,11,0.4);}
  .train-card.on-time{border-color:rgba(0,201,167,0.25);}
  .train-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .train-no{font-family:var(--mono);font-size:18px;font-weight:bold;color:var(--text);letter-spacing:1px;}
  .train-type{font-size:10px;padding:3px 8px;border-radius:20px;font-family:var(--mono);letter-spacing:1px;}
  .type-express{background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.3);}
  .type-local{background:rgba(100,116,139,0.15);color:#94a3b8;border:1px solid rgba(100,116,139,0.3);}
  .type-tze{background:rgba(168,85,247,0.15);color:#c4b5fd;border:1px solid rgba(168,85,247,0.3);}
  .type-chu{background:rgba(236,72,153,0.15);color:#f9a8d4;border:1px solid rgba(236,72,153,0.3);}
  .train-times{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .time-scheduled{font-family:var(--mono);font-size:26px;color:var(--text);letter-spacing:1px;}
  .time-actual{font-family:var(--mono);font-size:20px;color:var(--warn);letter-spacing:1px;}
  .time-arrow{font-size:12px;color:var(--text-dim);}
  .train-bottom{display:flex;justify-content:space-between;align-items:center;}
  .delay-badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;}
  .delay-0{color:var(--accent);}
  .delay-late{color:var(--warn);background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);}
  .train-dest{font-size:11px;color:var(--text-dim);letter-spacing:1px;}
  .no-trains{text-align:center;padding:40px 20px;color:var(--text-dim);font-family:var(--mono);font-size:12px;letter-spacing:1px;border:1px dashed var(--border);border-radius:12px;line-height:2;}
  .update-time{text-align:center;font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:16px;letter-spacing:1px;}
  .tip{margin-top:24px;padding:12px 14px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.2);border-radius:8px;font-size:11px;color:var(--text-dim);line-height:1.7;letter-spacing:0.5px;}
  .tip strong{color:var(--accent2);}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-line">
      <div class="logo-dot"></div>
      <h1>通勤列車查詢</h1>
      <div class="logo-dot"></div>
    </div>
    <div class="subtitle">汐科 ⇄ 板橋 · 即時班次 + 誤點</div>
  </header>

  <div class="clock" id="clock">--:--:--</div>

  <div class="tabs">
    <div class="tab-btn active" id="tab-to-banqiao" onclick="setDir('to-banqiao')">
      <div class="tab-route">汐科 → 板橋</div>
      <div class="tab-label">上班方向</div>
    </div>
    <div class="tab-btn" id="tab-to-xike" onclick="setDir('to-xike')">
      <div class="tab-route">板橋 → 汐科</div>
      <div class="tab-label">下班方向</div>
    </div>
  </div>

  <button class="query-btn" id="queryBtn" onclick="fetchTrains()">▶ 查詢班次</button>

  <div class="loading" id="loading">
    <div class="loading-bar"></div>
    FETCHING LIVE DATA...
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="results" id="results">
    <div class="results-header">
      <span class="results-title" id="resultsTitle"></span>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div id="trainList"></div>
    <div class="update-time" id="updateTime"></div>
  </div>

  <div class="tip">
    <strong>說明：</strong>班次為未來 2 小時內。若列車誤點，以<span style="color:var(--warn)">實際預計時間</span>為準，尚未抵達的列車仍會顯示。資料來源：TDX 台鐵即時看板（延遲約 2 分鐘）。
  </div>
</div>

<script>
const WORKER_URL   = 'https://tra-proxy.angus-huang105.workers.dev';
const XIKE_CODE    = '0960';
const BANQIAO_CODE = '1010';

// 方向（從實際API資料確認）：
// Direction=0：往基隆/宜蘭方向（北上）→ 板橋→汐科方向
// Direction=1：往樹林/台中方向（南下）→ 汐科→板橋方向

const TRAIN_TYPES = {
  '1':{ name:'太魯閣', cls:'type-tze' },
  '2':{ name:'普悠瑪', cls:'type-chu' },
  '3':{ name:'自強',   cls:'type-express' },
  '4':{ name:'莒光',   cls:'type-express' },
  '5':{ name:'復興',   cls:'type-local' },
  '6':{ name:'區間',   cls:'type-local' },
  '10':{ name:'區間快', cls:'type-express' },
  '11':{ name:'自強',  cls:'type-express' },
};

let currentDir = 'to-banqiao';

function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
}
setInterval(updateClock, 1000);
updateClock();

function setDir(dir) {
  currentDir = dir;
  document.getElementById('tab-to-banqiao').className = 'tab-btn'+(dir==='to-banqiao'?' active':'');
  document.getElementById('tab-to-xike').className    = 'tab-btn'+(dir==='to-xike'?' active':'');
  document.getElementById('results').classList.remove('visible');
  document.getElementById('errorBox').classList.remove('visible');
}

async function fetchTrains() {
  const btn      = document.getElementById('queryBtn');
  const loading  = document.getElementById('loading');
  const errorBox = document.getElementById('errorBox');
  const results  = document.getElementById('results');

  btn.disabled = true;
  loading.classList.add('visible');
  errorBox.classList.remove('visible');
  results.classList.remove('visible');

  try {
    const fromCode = currentDir === 'to-banqiao' ? XIKE_CODE : BANQIAO_CODE;
    const res = await fetch(`${WORKER_URL}/?station=${fromCode}`);
    if (!res.ok) throw new Error(`查詢失敗(${res.status})`);

    const raw = await res.json();

    // Worker 直接回傳陣列 [...]
    // TDX 原始格式是 { TrainLiveBoards: [...] }
    // 兩種都處理
    let trains = [];
    if (Array.isArray(raw)) {
      trains = raw;
    } else if (raw.TrainLiveBoards) {
      trains = raw.TrainLiveBoards;
    } else if (raw.error) {
      throw new Error(raw.error);
    }

    renderResults(trains);

  } catch(err) {
    errorBox.textContent = `查詢失敗：${err.message}`;
    errorBox.classList.add('visible');
  } finally {
    btn.disabled = false;
    loading.classList.remove('visible');
  }
}

function parseTime(str) {
  if (!str) return null;
  const [h=0, m=0, s=0] = str.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, s, 0);
  if (d < new Date(Date.now() - 4*3600000)) d.setDate(d.getDate()+1);
  return d;
}

function getActualTime(t) {
  const base = parseTime(t.ScheduledDepartureTime || t.ScheduledArrivalTime);
  if (!base) return new Date(9999,0);
  return new Date(base.getTime() + (t.DelayTime||0)*60000);
}

function renderResults(trains) {
  const now         = new Date();
  const twoHrsLater = new Date(now.getTime() + 2*3600000);

  // 汐科→板橋（上班）Direction=1（南下，往樹林/台中）
  // 板橋→汐科（下班）Direction=0（北上，往基隆/宜蘭）
  const wantDir = currentDir === 'to-banqiao' ? 1 : 0;

  const filtered = trains.filter(t => {
    if (t.Direction !== wantDir) return false;
    const sched  = parseTime(t.ScheduledDepartureTime || t.ScheduledArrivalTime);
    if (!sched) return false;
    const actual = getActualTime(t);
    if (actual < now)         return false;
    if (sched > twoHrsLater)  return false;
    return true;
  });

  filtered.sort((a,b) => getActualTime(a) - getActualTime(b));

  const dirText = currentDir === 'to-banqiao' ? '汐科 → 板橋' : '板橋 → 汐科';
  document.getElementById('resultsTitle').textContent = `${dirText} 未來班次`;
  document.getElementById('resultsCount').textContent = `共 ${filtered.length} 班`;

  const list = document.getElementById('trainList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="no-trains">
      目前查無未來 2 小時班次<br>
      <span style="font-size:10px">API 共回傳 ${trains.length} 筆・可能為離峰時段</span>
    </div>`;
  } else {
    list.innerHTML = filtered.map(renderCard).join('');
  }

  const nowStr = now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updateTime').textContent = `資料更新時間：${nowStr}（TDX 資料約延遲 2 分鐘）`;
  document.getElementById('results').classList.add('visible');
}

function renderCard(t, idx) {
  const delay    = t.DelayTime || 0;
  const sched    = parseTime(t.ScheduledDepartureTime || t.ScheduledArrivalTime);
  const actual   = getActualTime(t);
  const fmt      = d => d ? [d.getHours(),d.getMinutes()].map(v=>String(v).padStart(2,'0')).join(':') : '--:--';
  const typeCode = String(t.TrainTypeCode || '6');
  const typeInfo = TRAIN_TYPES[typeCode] || { name:'列車', cls:'type-local' };

  // EndingStationName 可能是物件 {Zh_tw:'...'} 或字串
  const destName = (typeof t.EndingStationName === 'object')
    ? (t.EndingStationName.Zh_tw || '---')
    : (t.EndingStationName || '---');

  const delayBadge = delay === 0
    ? `<span class="delay-badge delay-0">準點</span>`
    : `<span class="delay-badge delay-late">誤點 +${delay} 分</span>`;

  const timePart = delay > 0
    ? `<div class="train-times">
        <span class="time-scheduled" style="text-decoration:line-through;color:var(--text-dim);font-size:18px">${fmt(sched)}</span>
        <span class="time-arrow">→</span>
        <span class="time-actual">${fmt(actual)}</span>
       </div>`
    : `<div class="train-times"><span class="time-scheduled">${fmt(sched)}</span></div>`;

  return `
    <div class="train-card ${delay>0?'delayed':'on-time'}" style="animation-delay:${idx*0.05}s">
      <div class="train-top">
        <div class="train-no">${t.TrainNo || '----'}</div>
        <span class="train-type ${typeInfo.cls}">${typeInfo.name}</span>
      </div>
      ${timePart}
      <div class="train-bottom">
        ${delayBadge}
        <span class="train-dest">往 ${destName}</span>
      </div>
    </div>`;
}
</script>
</body>
</html>
